<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e65100"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffcc80"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Geometric pattern -->
  <circle cx="1065" cy="95" r="67" fill="#f57c00" opacity="0.09"/>
    <circle cx="566" cy="597" r="66" fill="#f57c00" opacity="0.11"/>
    <circle cx="-53" cy="-3" r="70" fill="#f57c00" opacity="0.06"/>
    <circle cx="691" cy="19" r="89" fill="#f57c00" opacity="0.18"/>
    <circle cx="38" cy="-82" r="42" fill="#f57c00" opacity="0.16"/>
    <circle cx="265" cy="104" r="83" fill="#f57c00" opacity="0.11"/>
    <rect x="488" y="504" width="95" height="75" rx="8" fill="#e65100" opacity="0.06" transform="rotate(35, 811, 660)"/>
    <rect x="356" y="82" width="62" height="97" rx="8" fill="#e65100" opacity="0.10" transform="rotate(16, 583, 52)"/>
    <rect x="855" y="45" width="75" height="52" rx="8" fill="#e65100" opacity="0.07" transform="rotate(17, 1215, 458)"/>
    <rect x="1062" y="336" width="27" height="76" rx="8" fill="#e65100" opacity="0.05" transform="rotate(38, 656, 11)"/>
    <rect x="296" y="317" width="96" height="53" rx="8" fill="#e65100" opacity="0.08" transform="rotate(37, 230, 91)"/>
    <rect x="0" y="179" width="42" height="45" rx="8" fill="#e65100" opacity="0.05" transform="rotate(34, 159, 570)"/>
    <rect x="318" y="633" width="67" height="40" rx="8" fill="#e65100" opacity="0.11" transform="rotate(28, 883, 637)"/>
    <rect x="619" y="265" width="84" height="75" rx="8" fill="#e65100" opacity="0.11" transform="rotate(18, 956, 502)"/>
    <polygon points="1119,-102 1155,-30 1083,-30" fill="#f57c00" opacity="0.09"/>
    <polygon points="52,384 80,440 24,440" fill="#f57c00" opacity="0.13"/>
    <polygon points="925,-48 994,90 856,90" fill="#f57c00" opacity="0.12"/>
    <polygon points="1217,-99 1255,-23 1179,-23" fill="#f57c00" opacity="0.09"/>

  <!-- Wave at bottom -->
  <path d="M0,564 C360,597 840,531 1200,564 L1200,630 L0,630Z" fill="#f57c00" opacity="0.3"/>

  <!-- 중앙 텍스트 카드 -->
  <rect x="80" y="195" width="1040" height="260" rx="20" fill="rgba(0,0,0,0.35)" filter="url(#blur-bg)"/>
  <filter id="blur-bg"><feGaussianBlur stdDeviation="8"/></filter>

  <text x="600" y="270" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="2">
    화곡 셔츠룸
  </text>
  <text x="600" y="330" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.85)">
    마포 — 네트워크 보안
  </text>

  <!-- Accent line -->
  <line x1="450" y1="355" x2="750" y2="355" stroke="#ffcc80" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- 하단 CTA -->
  <rect x="440" y="385" width="320" height="40" rx="20" fill="#ffcc80" opacity="0.9"/>
  <text x="600" y="411" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="16" font-weight="600" fill="#ffffff">
    ▼ 자세히 보기
  </text>

  <!-- 상단 브랜드 -->
  <text x="60" y="55" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.6)">
    마포 화곡 셔츠룸 — 네트워크 보안
  </text>
</svg>